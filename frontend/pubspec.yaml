name: roamly
description: "Roamly - A production-ready Flutter app with Clean Architecture."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  
  # State Management
  provider: ^6.1.2

  # API Calls
  dio: ^5.7.0
  http: ^1.2.2

  # Typography & Design
  google_fonts: ^6.2.0

  # Responsive UI
  flutter_screenutil: ^5.9.3

  # Local Cache
  shared_preferences: ^2.2.3

  # Icons
  cupertino_icons: ^1.0.8
  url_launcher: ^6.3.2
  image_picker: ^1.1.2
  cached_network_image: ^3.4.1
  share_plus: ^13.2.0
  timeago: ^3.7.1
  intl: ^0.20.3
  flutter_rating_bar: ^4.0.1
  shimmer: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/
